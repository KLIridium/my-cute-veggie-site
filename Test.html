<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Try it? 🌱</title>
  <style>
    /* --- cute global reset & theme --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fff0f5 0%, #ffe4ec 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* floating hearts & veggies background */
    .floating-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-bg span {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.25;
      animation: floatUp 12s infinite linear;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0.1; }
      20% { opacity: 0.35; }
      80% { opacity: 0.35; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* --- main card --- */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 60px 60px 60px 60px;
      padding: 2.5rem 2rem 2.8rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(255, 140, 170, 0.25),
                  0 8px 20px rgba(255, 120, 150, 0.2),
                  inset 0 1px 4px rgba(255, 255, 255, 0.8);
      border: 2px solid #ffb7c5;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.005);
    }

    /* cute header with courting theme */
    .courtship-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 1.1rem;
      color: #c44b6b;
      letter-spacing: 1px;
      font-weight: 500;
      background: #ffeef2;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      display: inline-block;
      border: 1.5px dashed #ff9eb5;
    }

    h1 {
      font-size: 2.5rem;
      color: #b3415c;
      margin: 0.5rem 0 0.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0 #ffd9e2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    h1 span {
      font-size: 2.8rem;
    }

    .subhead {
      font-size: 1.1rem;
      color: #9b4b63;
      margin-bottom: 2rem;
      font-style: italic;
      border-bottom: 2px dotted #ffb0c3;
      padding-bottom: 0.8rem;
      display: inline-block;
      padding-inline: 1rem;
    }

    /* veggie illustration / emoji row */
    .veggie-row {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      font-size: 2.8rem;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 8px 10px rgba(255, 150, 170, 0.3));
    }

    .veggie-row span {
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }

    .veggie-row span:nth-child(2) { animation-delay: 0.2s; }
    .veggie-row span:nth-child(3) { animation-delay: 0.4s; }
    .veggie-row span:nth-child(4) { animation-delay: 0.6s; }
    .veggie-row span:nth-child(5) { animation-delay: 0.8s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* message bubble */
    .message-box {
      background: #fff9fb;
      border-radius: 35px;
      padding: 1.5rem 1.2rem;
      margin: 1.5rem 0 2rem;
      border: 2px solid #ffc1d0;
      box-shadow: inset 0 2px 10px rgba(255, 200, 210, 0.4), 0 6px 0 #ffb0c3;
      transition: all 0.3s ease;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .message-text {
      font-size: 1.35rem;
      color: #7d3e50;
      line-height: 1.6;
      font-weight: 500;
    }

    .message-sub {
      font-size: 1rem;
      color: #ad6b7e;
      margin-top: 0.6rem;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    /* button group */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .cute-btn {
      border: none;
      background: #ffb0c3;
      color: #4f1e2b;
      font-weight: 700;
      font-size: 1.25rem;
      padding: 1rem 2.2rem;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 8px 0 #b34d68, 0 10px 20px rgba(255, 120, 140, 0.4);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      letter-spacing: 0.5px;
      border: 2px solid #fff2f5;
      flex: 0 1 auto;
    }

    .cute-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b34d68, 0 8px 18px rgba(255, 120, 140, 0.4);
    }

    .cute-btn.veggie-btn {
      background: #9fd9a8;
      box-shadow: 0 8px 0 #569b62, 0 10px 20px rgba(130, 200, 140, 0.4);
      color: #1e4025;
    }

    .cute-btn.veggie-btn:active {
      box-shadow: 0 2px 0 #569b62, 0 8px 18px rgba(130, 200, 140, 0.4);
    }

    .cute-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b34d68, 0 5px 12px rgba(255, 120, 140, 0.3);
      pointer-events: none;
      filter: grayscale(0.3);
    }

    /* little "I'll be happy / worried" status */
    .status-badge {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 1rem;
      color: #a5536b;
    }

    .status-item {
      background: #ffeef2;
      border-radius: 60px;
      padding: 0.5rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1.5px solid #ffb7c5;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(255, 180, 190, 0.3);
      transition: all 0.3s ease;
    }

    .status-item.happy {
      background: #e3ffe7;
      border-color: #a8e0b2;
      color: #2b6b39;
    }

    .status-item.worried {
      background: #ffe0e7;
      border-color: #ff9eb5;
      color: #b13e5a;
    }

    /* tiny footnote */
    .footnote {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #c37892;
      letter-spacing: 0.5px;
    }

    /* responsive */
    @media (max-width: 480px) {
      .card { padding: 1.8rem 1.2rem; border-radius: 40px; }
      h1 { font-size: 1.9rem; }
      .message-text { font-size: 1.15rem; }
      .cute-btn { font-size: 1.1rem; padding: 0.8rem 1.4rem; }
      .veggie-row { font-size: 2.2rem; gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <!-- floating background emojis -->
  <div class="floating-bg" id="floatingBg"></div>

  <div class="card">
    <div class="courtship-header">
      <span>💌</span> To my future lawyer <span>💌</span>
    </div>

    <h1>
      <span>🥕</span> eat veggies <span>🥦</span>
    </h1>
    <div class="subhead">So you stay pretty & healthy & I stay happy</div>

    <!-- cute veggie row -->
    <div class="veggie-row">
      <span>🥬</span>
      <span>🥕</span>
      <span>🌽</span>
      <span>🍅</span>
      <span>🥦</span>
    </div>

    <!-- message box changes dynamically -->
    <div class="message-box" id="messageBox">
      <div class="message-text" id="messageText">
        Please eat your vegetables, Danna.
      </div>
      <div class="message-sub" id="messageSub">
        <span>🌸</span> They make you glow. <span>🌸</span>
      </div>
    </div>

    <!-- buttons -->
    <div class="button-group">
      <button class="cute-btn veggie-btn" id="eatBtn">
        🥗 I ate veggies
      </button>
      <button class="cute-btn" id="skipBtn">
        🙈 I skipped
      </button>
    </div>

    <!-- status area showing happy / worried -->
    <div class="status-badge" id="statusBadge">
      <div class="status-item" id="happyStatus">
        <span>😊</span> I'm happy
      </div>
      <div class="status-item" id="worriedStatus">
        <span>😟</span> I'm worried
      </div>
    </div>

    <div class="footnote">
      🌱 because your health is my love language 🌱
    </div>
  </div>

  <script>
    (function() {
      // ----- cute floating background emojis -----
      const bgContainer = document.getElementById('floatingBg');
      const emojis = ['❤️', '🥕', '🥦', '🌸', '💕', '🥬', '🌽', '🍅', '💖', '🌿', '🥗', '✨'];
      const EMOJI_COUNT = 18;

      for (let i = 0; i < EMOJI_COUNT; i++) {
        const span = document.createElement('span');
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
        span.textContent = randomEmoji;
        // random positioning & animation delays
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        span.style.animationDelay = Math.random() * 12 + 's';
        span.style.animationDuration = (10 + Math.random() * 12) + 's';
        span.style.opacity = 0.15 + Math.random() * 0.25;
        bgContainer.appendChild(span);
      }

      // ----- interactive courting logic -----
      const messageText = document.getElementById('messageText');
      const messageSub = document.getElementById('messageSub');
      const eatBtn = document.getElementById('eatBtn');
      const skipBtn = document.getElementById('skipBtn');
      const happyStatus = document.getElementById('happyStatus');
      const worriedStatus = document.getElementById('worriedStatus');
      const messageBox = document.getElementById('messageBox');

      // status classes management
      function setHappyStatus(active) {
        if (active) {
          happyStatus.classList.add('happy');
          worriedStatus.classList.remove('worried');
        } else {
          happyStatus.classList.remove('happy');
        }
      }

      function setWorriedStatus(active) {
        if (active) {
          worriedStatus.classList.add('worried');
          happyStatus.classList.remove('happy');
        } else {
          worriedStatus.classList.remove('worried');
        }
      }

      // reset both statuses to neutral (none highlighted)
      function resetStatuses() {
        happyStatus.classList.remove('happy');
        worriedStatus.classList.remove('worried');
      }

      // default neutral messages
      function setNeutralMessage() {
        messageText.textContent = 'Please eat your vegetables, my dear.';
        messageSub.innerHTML = '<span>🌸</span> they make you glow <span>🌸</span>';
        messageBox.style.borderColor = '#ffc1d0';
        messageBox.style.boxShadow = 'inset 0 2px 10px rgba(255, 200, 210, 0.4), 0 6px 0 #ffb0c3';
        resetStatuses();
      }

      // happy message (when user eats veggies)
      function setHappyMessage() {
        const happyMessages = [
          { text: 'Oh my! You ate your veggies! 🥰', sub: 'You\'re glowing already, and my heart is so full.' },
          { text: 'YES! Veggies make you even prettier 💖', sub: 'I\'m the happiest person right now.' },
          { text: 'You ate them! I\'m so proud of you 🌟', sub: 'Your body is thanking you, and so am I.' },
          { text: 'My sweet veggie lover! 😊', sub: 'You take such good care of yourself — I adore that.' }
        ];
        const pick = happyMessages[Math.floor(Math.random() * happyMessages.length)];
        messageText.textContent = pick.text;
        messageSub.innerHTML = `<span>💚</span> ${pick.sub} <span>💚</span>`;
        messageBox.style.borderColor = '#a8e0b2';
        messageBox.style.boxShadow = 'inset 0 2px 15px rgba(180, 240, 180, 0.5), 0 6px 0 #9fd9a8';

        // set happy status highlighted, remove worried
        happyStatus.classList.add('happy');
        worriedStatus.classList.remove('worried');
      }

      // worried message (when user skips)
      function setWorriedMessage() {
        const worriedMessages = [
          { text: 'Oh no... you skipped your veggies? 😟', sub: 'I\'m worried you might get sick. Please eat them next time, for me?' },
          { text: 'My heart aches a little... 🥺', sub: 'Without veggies, you might feel tired. I want you healthy and happy.' },
          { text: 'I\'m sad and worried, love. 💔', sub: 'Please eat something green? I only want the best for you.' },
          { text: 'You didn\'t eat them... I\'m concerned. 🌧️', sub: 'Nutrients keep you strong and pretty. I care about you so much.' }
        ];
        const pick = worriedMessages[Math.floor(Math.random() * worriedMessages.length)];
        messageText.textContent = pick.text;
        messageSub.innerHTML = `<span>💗</span> ${pick.sub} <span>💗</span>`;
        messageBox.style.borderColor = '#ff9eb5';
        messageBox.style.boxShadow = 'inset 0 2px 15px rgba(255, 160, 180, 0.5), 0 6px 0 #ff9eb5';

        // set worried status highlighted, remove happy
        worriedStatus.classList.add('worried');
        happyStatus.classList.remove('happy');
      }

      // --- event listeners ---
      eatBtn.addEventListener('click', () => {
        setHappyMessage();
        // add a little extra bounce effect to veggie row
        const veggieRow = document.querySelector('.veggie-row');
        veggieRow.style.transform = 'scale(1.1)';
        setTimeout(() => { veggieRow.style.transform = 'scale(1)'; }, 150);
      });

      skipBtn.addEventListener('click', () => {
        setWorriedMessage();
        // subtle shake on message box
        messageBox.style.transform = 'translateX(0)';
        const shake = () => {
          messageBox.style.transform = 'translateX(-5px)';
          setTimeout(() => messageBox.style.transform = 'translateX(5px)', 50);
          setTimeout(() => messageBox.style.transform = 'translateX(-3px)', 100);
          setTimeout(() => messageBox.style.transform = 'translateX(3px)', 150);
          setTimeout(() => messageBox.style.transform = 'translateX(0)', 200);
        };
        shake();
      });

      // optional: reset to neutral if both buttons pressed? not necessary.
      // double click on card to reset? just for cuteness, but we'll keep it minimal.
      // but we can add a subtle reset when mouse leaves for a while? nope, too complex.

      // for extra cuteness: pressing 'e' key acts like eat, 's' like skip (optional)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'e' || e.key === 'E') {
          eatBtn.click();
        } else if (e.key === 's' || e.key === 'S') {
          skipBtn.click();
        }
      });

      // set initial neutral state
      setNeutralMessage();
    })();
  </script>
</body>
</html>
